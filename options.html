<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Browser Toolkit</title>
    <style>
      body {
        max-width: 860px;
        margin: 32px auto;
        padding: 0 20px;
        color: #202124;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      section {
        margin-top: 24px;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      input {
        margin-right: 8px;
      }
      button {
        margin-right: 8px;
        padding: 6px 12px;
      }
      pre {
        max-height: 560px;
        padding: 16px;
        overflow: auto;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: #f8f9fa;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .muted {
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Private Browser Toolkit</h1>
      <section>
        <h2>功能</h2>
        <label>
          <input id="deduplicate" type="checkbox" />
          自动合并相同网址的标签页
        </label>
        <label>
          <input id="fullscreen" type="checkbox" />
          把新开的单标签普通窗口并入已有全屏窗口
        </label>
        <span id="feature-status" class="muted">更改立即生效</span>
      </section>
      <section>
        <h2>标签组备份</h2>
        <p>
          <button id="refresh" type="button">刷新</button>
          <button id="export" type="button">导出 JSON</button>
        </p>
        <p id="backup-status" class="muted"></p>
        <pre id="backup-output">正在读取…</pre>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
